<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>领课</title>
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body class="admin-body">
    <aside class="sidebar">
      <div class="brand">
        <strong>领课</strong>
        <span>教务中台</span>
      </div>
      <nav id="menu" class="menu"></nav>
    </aside>
    <div class="shell">
      <header class="topbar">
        <h1 id="page-title">工作台</h1>
        <div class="topbar-right">
          <span id="current-user"></span>
          <button type="button" id="logout" class="ghost">退出</button>
        </div>
      </header>
      <main id="content" class="content"></main>
    </div>

    <dialog id="course-dialog">
      <form id="course-form" method="dialog" class="dialog-form">
        <h3 id="course-dialog-title">新增课程</h3>
        <input id="course-id" type="hidden" />
        <label>课程名称<input id="course-title" required /></label>
        <label>课程简介<textarea id="course-summary" required></textarea></label>
        <label>授课教师<input id="course-teacher" required /></label>
        <label>课时<input id="course-hours" type="number" min="1" step="1" required /></label>
        <label>状态
          <select id="course-status">
            <option value="open">招生中</option>
            <option value="closed">已结课</option>
          </select>
        </label>
        <label>封面图
          <input id="course-cover" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/svg+xml" />
        </label>
        <img id="course-cover-preview" class="cover-preview" alt="封面预览" hidden />
          <p class="hint" id="course-cover-hint">新增必须选封面。编辑时不选文件，就还用原来的图。</p>
        <p id="course-dialog-error" class="error" hidden></p>
        <div class="dialog-actions">
          <button type="button" id="course-dialog-cancel" class="ghost">取消</button>
          <button type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="notice-dialog">
      <form id="notice-form" method="dialog" class="dialog-form">
        <h3 id="notice-dialog-title">发布公告</h3>
        <input id="notice-id" type="hidden" />
        <label>标题<input id="notice-title" required /></label>
        <label>作者<input id="notice-author" required /></label>
        <label>正文<textarea id="notice-content" required></textarea></label>
        <label>状态
          <select id="notice-status">
            <option value="published">已发布</option>
            <option value="draft">草稿</option>
          </select>
        </label>
        <p id="notice-dialog-error" class="error" hidden></p>
        <div class="dialog-actions">
          <button type="button" id="notice-dialog-cancel" class="ghost">取消</button>
          <button type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="user-dialog">
      <form id="user-form" method="dialog" class="dialog-form">
        <h3 id="dialog-title">新增用户</h3>
        <input id="user-id" type="hidden" />
        <label>用户名<input id="user-username" required /></label>
        <label id="password-label">密码<input id="user-password" type="password" /></label>
        <label>姓名<input id="user-name" required /></label>
        <label>邮箱<input id="user-email" type="email" required /></label>
        <label>角色
          <select id="user-role">
            <option value="teacher">教师</option>
            <option value="admin">管理员</option>
          </select>
        </label>
        <label>状态
          <select id="user-status">
            <option value="active">启用</option>
            <option value="disabled">停用</option>
          </select>
        </label>
        <p id="dialog-error" class="error" hidden></p>
        <div class="dialog-actions">
          <button type="button" id="dialog-cancel" class="ghost">取消</button>
          <button type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="student-dialog">
      <form id="student-form" method="dialog" class="dialog-form">
        <h3 id="student-dialog-title">新增学生</h3>
        <input id="student-id" type="hidden" />
        <label>学号<input id="student-no" required /></label>
        <label>姓名<input id="student-name" required /></label>
        <label>性别
          <select id="student-gender">
            <option value="male">男</option>
            <option value="female">女</option>
          </select>
        </label>
        <label>班级<input id="student-class" required /></label>
        <label>联系电话<input id="student-phone" required /></label>
        <label>状态
          <select id="student-status">
            <option value="active">在校</option>
            <option value="disabled">离校</option>
          </select>
        </label>
        <p id="student-dialog-error" class="error" hidden></p>
        <div class="dialog-actions">
          <button type="button" id="student-dialog-cancel" class="ghost">取消</button>
          <button type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/js/admin.js"></script>
  </body>
</html>
